  <text x="22" y="341.5" textLength="182.8" lengthAdjust="spacing" class="l" style="animation-delay: 2.78s" xml:space="preserve"><tspan fill="#e6edf3">│   └── </tspan><tspan fill="#56d4dd">Node</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">(virtual)</tspan></text>
  <text x="22" y="361.0" textLength="71.5" lengthAdjust="spacing" class="l" style="animation-delay: 2.83s" xml:space="preserve"><tspan fill="#e6edf3">└── </tspan><tspan fill="#56d4dd">Right</tspan></text>
  <text x="22" y="380.5" textLength="182.8" lengthAdjust="spacing" class="l" style="animation-delay: 2.87s" xml:space="preserve"><tspan fill="#e6edf3">    └── </tspan><tspan fill="#56d4dd">Node</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">(virtual)</tspan></text>
  <text x="22" y="400.0" class="l" style="animation-delay: 2.92s" xml:space="preserve"></text>
  <text x="22" y="419.5" textLength="23.9" lengthAdjust="spacing" class="l" style="animation-delay: 2.96s" xml:space="preserve"><tspan fill="#6e7681">  ⋮</tspan></text>
  <text x="22" y="439.0" textLength="198.8" lengthAdjust="spacing" class="l" style="animation-delay: 3.01s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">std::bad_array_new_length</tspan></text>
  <text x="22" y="458.5" textLength="143.1" lengthAdjust="spacing" class="l" style="animation-delay: 3.05s" xml:space="preserve"><tspan fill="#e6edf3">└── </tspan><tspan fill="#56d4dd">std::bad_alloc</tspan></text>
  <text x="22" y="478.0" textLength="174.9" lengthAdjust="spacing" class="l" style="animation-delay: 3.10s" xml:space="preserve"><tspan fill="#e6edf3">    └── </tspan><tspan fill="#56d4dd">std::exception</tspan></text>
  <g class="l" style="animation-delay: 3.74s"><text x="22" y="497.5" textLength="389.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7ee787" font-weight="700">$ </tspan><tspan fill="#e6edf3" font-weight="700">rtti-dump --mermaid sample64.dll | grep Diamond</tspan></text><g class="ty22"><rect class="cover" x="37.9" y="483.0" width="602.1" height="19.5" fill="#0d1117"/><rect class="cu22 cover" x="37.9" y="486.0" width="8.0" height="14.5" fill="#e6edf3" opacity="0.85"/></g></g>
  <text x="22" y="517.0" textLength="238.5" lengthAdjust="spacing" class="l" style="animation-delay: 5.55s" xml:space="preserve"><tspan fill="#e6edf3">    class c_Diamond[&quot;Diamond&quot;]</tspan></text>
  <text x="22" y="536.5" textLength="198.8" lengthAdjust="spacing" class="l" style="animation-delay: 5.60s" xml:space="preserve"><tspan fill="#e6edf3">    c_Left &lt;|-- c_Diamond</tspan></text>
  <text x="22" y="556.0" textLength="206.7" lengthAdjust="spacing" class="l" style="animation-delay: 5.64s" xml:space="preserve"><tspan fill="#e6edf3">    c_Right &lt;|-- c_Diamond</tspan></text>
  <g class="l" style="animation-delay: 5.69s"><text x="22" y="575.5"><tspan fill="#7ee787" font-weight="700">$</tspan></text><rect class="cursor" x="37.9" y="564.0" width="8.0" height="14.5" fill="#e6edf3" opacity="0.85"/></g>
