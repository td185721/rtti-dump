  <text x="22" y="263.5" class="l" style="animation-delay: 2.60s" xml:space="preserve"></text>
  <text x="22" y="283.0" textLength="23.9" lengthAdjust="spacing" class="l" style="animation-delay: 2.65s" xml:space="preserve"><tspan fill="#6e7681">  ⋮</tspan></text>
  <text x="22" y="302.5" textLength="55.6" lengthAdjust="spacing" class="l" style="animation-delay: 2.69s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Diamond</tspan></text>
