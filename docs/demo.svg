  <text x="22" y="205.0" textLength="79.5" lengthAdjust="spacing" class="l" style="animation-delay: 2.47s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">io::Buffer</tspan></text>
  <text x="22" y="224.5" textLength="111.3" lengthAdjust="spacing" class="l" style="animation-delay: 2.51s" xml:space="preserve"><tspan fill="#e6edf3">├── </tspan><tspan fill="#56d4dd">io::Reader</tspan></text>
